# liddy.bygelo.com — one-time setup on the VPS.
#
# The box is `bygelo`, which serves every other bygelo.com
# subdomain. Not `advo` — that one is advo.ph and fourlinq.ph.
#
#   scp Script/site-nginx.conf bygelo:/etc/nginx/sites-available/liddy.bygelo.com
#   ssh bygelo 'ln -sf /etc/nginx/sites-available/liddy.bygelo.com /etc/nginx/sites-enabled/liddy.bygelo.com \
#               && mkdir -p /var/www/liddy && nginx -t && systemctl reload nginx'
#
# Then, once the DNS A record resolves to this box:
#
#   ssh bygelo 'certbot --nginx -d liddy.bygelo.com'
#
# Certbot rewrites this file in place to add the TLS block and the :80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name liddy.bygelo.com;

    root /var/www/liddy;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The font and the images are content-addressed by release, not by name, so
    # they are safe to cache hard. index.html deliberately is not.
    location ~* \.(woff2|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml font/woff2;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
